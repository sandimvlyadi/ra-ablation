[project]
name = "ramscore"
version = "0.1.0"
description = "Label-efficient, imbalance-aware joint-level erosion grading on RAM-H1200 (thesis experiments)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.5",
    "timm>=1.0",
    "albumentations>=1.4",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
]

[dependency-groups]
analysis = [
    "matplotlib>=3.11.2",
    "statsmodels>=0.15.0",
]
app = [
    "streamlit>=1.66.1",
]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ramscore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
